---
name: Test
description: Runs pytest coverage tests using uv

inputs:
  cache-path:
    description: Paths to cache
    default: ""

  pyproject-toml:
    description: Path of pyproject.toml
    required: true

  python-version:
    description: Version of python to test
    required: true

runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        ref: ${{ github.ref }}
        repository: ${{ github.repository }}

    - name: Cache ${{ inputs.cache-path }}
      if: inputs.cache-path != ''
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ inputs.cache-path }}
        key:
          test-${{ hashFiles('pyproject.toml') }}-${{ inputs.python-version }}

    - name: Set up uv ${{ inputs.python-version }}
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --all-groups

    - name: Test with pytest
      shell: bash
      run: uv run pytest --cov --cov-report=lcov
